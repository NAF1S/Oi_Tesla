  # -------------------------------------------------------------------------
  # Documentation
  # -------------------------------------------------------------------------
  /docs:
    get:
      tags: [Documentation]
      summary: This document
      description: Served verbatim from `server/openapi.yaml`, as `text/yaml`.
      operationId: getOpenApiDocument
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document.
          content:
            text/yaml:
              schema: { type: string }

  # -------------------------------------------------------------------------
  # The rest of the API
  #
  # These predate the read-API milestone and are described in full, one section
  # per milestone, in `README.md`. They are documented here too -- concisely, with
  # their parameters, bodies and responses -- because a specification that covers
  # only part of the API is worse than none: a reader cannot tell a missing
  # endpoint from one that does not exist.
  # -------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Authentication]
      summary: Sign up as a PASSENGER or DRIVER, and sign in
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              additionalProperties: false
              properties:
                name: { type: string, example: Nusrat Jahan }
                email: { type: string, format: email, example: nusrat@example.com }
                password: { type: string, minLength: 8, format: password }
                role: { type: string, enum: [PASSENGER, DRIVER], default: PASSENGER }
      responses:
        '201':
          description: The account was created and the auth cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An account with that email already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in; sets the auth cookie
      description: |
        The token is returned **only** as an HttpOnly cookie, never in the body.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email, example: jashim@example.com }
                password: { type: string, format: password }
            example: { email: jashim@example.com, password: DemoPass123! }
      responses:
        '200':
          description: Signed in; the cookie is set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The email or password is wrong. One message for both, so neither can be probed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      tags: [Authentication]
      summary: The authenticated user
      operationId: getAuthenticatedUser
      parameters: []
      responses:
        '200':
          description: The user the cookie names, as the database has them now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Clear the auth cookie
      description: Safe to retry — a second logout is still a success.
      operationId: logout
      parameters: []
      responses:
        '200':
          description: The cookie was cleared.
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string } } }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /users:
    get:
      tags: [Users]
      summary: List users
      description: >
        **Still public**, so the demo page renders before anyone signs in. See the
        README's next steps.
      operationId: listUsers
      security: []
      parameters: []
      responses:
        '200':
          description: Every user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
    post:
      tags: [Users]
      summary: Create a user
      description: ADMIN only.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              additionalProperties: false
              properties:
                name: { type: string, example: Shirin Akter }
                email: { type: string, format: email, example: shirin@example.com }
      responses:
        '201':
          description: The user was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a single user
      description: Public, like the list.
      operationId: getUser
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /health:
    get:
      tags: [Operational]
      summary: Service status
      description: |
        Reports `"ok"` when the database is reachable and `"degraded"` when it is
        not. Never fails the request, so a monitor gets an answer either way.
      operationId: getHealth
      security: []
      parameters: []
      responses:
        '200':
          description: The status, whatever the database is doing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  uptime: { type: number }
                  timestamp: { type: string, format: date-time }
                  database:
                    type: object
                    properties:
                      status: { type: string, enum: [up, down] }
                      latencyMs: { type: integer, nullable: true }
              example:
                status: ok
                uptime: 23.6
                timestamp: '2026-09-22T18:47:05.740Z'
                database: { status: up, latencyMs: 2 }

  /location/zones:
    get:
      tags: [Location]
      summary: List the active service zones
      operationId: listZones
      security: []
      parameters: []
      responses:
        '200':
          description: The seeded zones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Zone' } }

  /location/points:
    get:
      tags: [Location]
      summary: List active service points
      operationId: listServicePoints
      security: []
      parameters:
        - name: zoneCode
          in: query
          required: false
          description: Restrict to one zone. Case-insensitive.
          schema: { type: string, example: banani }
      responses:
        '200':
          description: The service points, optionally filtered by zone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ServicePointWithId' }
              example:
                data:
                  - id: 00984d60-f962-4765-bbe3-ba40e7f61d98
                    code: banani-road-11
                    name: Banani Road 11
                    zoneCode: banani
                    latitude: 23.7937
                    longitude: 90.4043
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /location/points/{code}:
    get:
      tags: [Location]
      summary: Get one service point by code
      operationId: getServicePoint
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, example: banani-road-11 }
      responses:
        '200':
          description: The service point.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicePointWithId' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The point exists but is inactive.

  /routes/estimate:
    post:
      tags: [Routing and pricing]
      summary: Estimate a route between two service points
      description: Requires authentication — see the README's Routing section.
      operationId: estimateRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originServicePointCode, destinationServicePointCode]
              additionalProperties: false
              properties:
                originServicePointCode: { type: string, example: banani-road-11 }
                destinationServicePointCode: { type: string, example: mohakhali-bus-terminal }
                departureAt: { type: string, format: date-time, description: 'Defaults to now.' }
      responses:
        '200':
          description: The route, in metres and seconds, with the profile it was measured under.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteEstimate' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: No route exists between the two points in this direction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /fare-quotes:
    post:
      tags: [Routing and pricing]
      summary: Quote a solo fare
      description: PASSENGER only. The quote is owned by the caller and frozen.
      operationId: createFareQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originServicePointCode, destinationServicePointCode]
              additionalProperties: false
              properties:
                originServicePointCode: { type: string, example: banani-road-11 }
                destinationServicePointCode: { type: string, example: mohakhali-bus-terminal }
                departureAt:
                  type: string
                  format: date-time
                  description: 'The instant the fare is priced at. Defaults to now.'
      responses:
        '201':
          description: The quote. A retry with the same inputs returns the same quote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FareQuote' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'

  /ride-requests:
    post:
      tags: [Ride requests]
      summary: Ask for a ride from a quote the caller owns
      description: |
        PASSENGER only. The `Idempotency-Key` header is **required**: a retry with
        the same key returns the request the first call created, as a `200`.
      operationId: createRideRequest
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 8–128 characters. Identifies one intent, not one attempt.
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fareQuoteId]
              additionalProperties: false
              properties:
                fareQuoteId: { type: string, format: uuid }
            example: { fareQuoteId: 3f2a1b0c-9d8e-4f7a-8b6c-5d4e3f2a1b0c }
      responses:
        '201':
          description: The request was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRequestWithTrip' }
        '200':
          description: An idempotent retry returned the request that already existed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRequestWithTrip' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          description: The quote does not exist, or is not the caller's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The caller already has an active ride request.

  /ride-requests/my:
    get:
      tags: [Ride requests]
      summary: The caller's own ride requests, newest first
      description: |
        Superseded by `GET /passengers/me/rides` for a passenger client, and still
        supported. Same pagination envelope.
      operationId: listMyRideRequests
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RideRequestStatus' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: One page of the caller's own requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pagination' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'

  /ride-requests/{id}:
    get:
      tags: [Ride requests]
      summary: One of the caller's own ride requests
      description: |
        Includes the `trip` block once the request is matched. Somebody else's
        request is a `404`.
      operationId: getRideRequest
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The request, with the passenger's own trip when there is one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRequestWithTrip' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'

  /ride-requests/{id}/cancel:
    post:
      tags: [Ride requests]
      summary: Cancel a request that is still WAITING
      description: The only passenger-driven status change. A matched request cannot be cancelled.
      operationId: cancelRideRequest
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  enum: [CHANGED_MIND, WRONG_LOCATION, WAIT_TOO_LONG, OTHER]
                  default: OTHER
      responses:
        '200':
          description: The cancelled request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRequestWithTrip' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is no longer WAITING.

  /ride-requests/{id}/fare:
    get:
      tags: [Ride requests]
      summary: The caller's own shared fare, with its breakdown
      description: |
        Answers `404` when there is no shared fare to report — before a match, and
        for the moment around a match before its calculation is written. A
        passenger who is not sharing anything has no pooled fare, and reporting
        `0.00` would be inventing an answer.
      operationId: getRideRequestFare
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: This passenger's allocation, and the rules that produced it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassengerFare' }
              example:
                rideRequestId: 86274eb8-0f84-42b3-b2b8-3619d7c7f902
                fareStatus: FINALIZED
                calculationStatus: FINALIZED
                currency: BDT
                acceptedSoloFare: '130'
                currentPooledFare: '130'
                baseFare: '40.00'
                allocatedLegCost: '86.63'
                uncappedPooledFare: '126.63'
                minimumFare: '80.00'
                minimumFareApplied: false
                unroundedFare: '126.63'
                fareRoundingAdjustment: '3.37'
                legsPaidFor: 1
                previousPooledFare: null
                soloCapApplied: false
                noIncreaseCapApplied: false
                soloCapReduction: '0.00'
                noIncreaseReduction: '0.00'
                totalReduction: '0.00'
                savedAgainstSoloFare: '0'
                pricingCode: dhaka-solo
                pricingVersion: 1
                sharedFareRuleVersion: pool-leg-share-v2
                poolVersion: 1
                calculatedAt: '2026-09-25T12:17:06.902Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'

  /drivers/me/online:
    post:
      tags: [Driver availability]
      summary: Go online
      description: |
        Superseded by `PATCH /drivers/me/availability`, and still supported with
        the same behaviour and the same refusals.
      operationId: goOnline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentServicePointCode]
              additionalProperties: false
              properties:
                currentServicePointCode: { type: string, example: banani-kakoli }
                vehicleId: { type: string, format: uuid }
      responses:
        '200':
          description: The availability after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverAvailability' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already reserved or on a ride, no usable vehicle, or an inactive service point.

  /drivers/me/offline:
    post:
      tags: [Driver availability]
      summary: Go offline
      description: Superseded by `PATCH /drivers/me/availability`. Idempotent.
      operationId: goOffline
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The availability after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverAvailability' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '409':
          description: The driver is RESERVED or ON_RIDE.

  /drivers/me/current-service-point:
    put:
      tags: [Driver availability]
      summary: Move to another service point
      description: |
        The MVP's stand-in for GPS, and how a driver refreshes `lastSeenAt` while
        waiting. A RESERVED or ON_RIDE driver cannot move.
      operationId: setCurrentServicePoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentServicePointCode]
              additionalProperties: false
              properties:
                currentServicePointCode: { type: string, example: gulshan-2-circle }
      responses:
        '200':
          description: The availability after the move.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverAvailability' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The driver is RESERVED or ON_RIDE, or the point is inactive.

  /drivers/me/offers:
    get:
      tags: [Dispatch]
      summary: The driver's own dispatch offers, of both kinds
      description: Defaults to the offers the driver can still act on; `status=ALL` asks for the history.
      operationId: listOffers
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PENDING, ACCEPTED, REJECTED, EXPIRED, CANCELLED, ALL] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: The driver's own offers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DispatchOffer' } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'

  /drivers/me/offers/{offerId}:
    get:
      tags: [Dispatch]
      summary: One of the driver's own offers
      operationId: getOffer
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The offer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchOffer' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'

  /drivers/me/offers/{offerId}/accept:
    post:
      tags: [Dispatch]
      summary: Accept an offer
      description: |
        Takes **no body** — anything sent is a `400`. Creates a pool, or adds the
        passenger to the one the offer named, and answers with the pool.
      operationId: acceptOffer
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The pool the acceptance produced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pool' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The offer expired or was already answered, the driver is no longer
            eligible, the vehicle changed, or the pool moved on.

  /drivers/me/offers/{offerId}/reject:
    post:
      tags: [Dispatch]
      summary: Refuse an offer
      description: The request moves on; the pool does not change.
      operationId: rejectOffer
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, enum: [TOO_FAR, BREAK, ENDING_SHIFT, VEHICLE, OTHER] }
      responses:
        '200':
          description: The refused offer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchOffer' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The offer is no longer pending.

  /drivers/me/pool:
    get:
      tags: [Driver reads]
      summary: The pool the driver is committed to (alias)
      description: An alias of `/drivers/me/current-pool`, kept for callers written before the trip milestone. All three of these names answer with the same DTO; `current-pool` is the documented one.
      operationId: getCurrentPoolLegacyAlias
      parameters: []
      responses:
        '200':
          description: The active pool, or `null`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pool:
                    oneOf:
                      - $ref: '#/components/schemas/Pool'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'

  /drivers/me/pools/{poolId}/depart:
    post:
      tags: [Trip]
      summary: Set off for the first pickup
      description: |
        Closes the pool to matching and **freezes the fare** in the same
        transaction. Takes no body. Idempotent by state: a second departure
        returns the state the first one produced, moving no timestamp.
      operationId: departPool
      parameters:
        - name: poolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The pool as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The pool is not FORMING, has no members, or has no drivable plan.

  /drivers/me/pools/{poolId}/stops/{stopId}/arrive:
    post:
      tags: [Trip]
      summary: Reach the next actionable stop
      description: |
        Only the lowest-sequence stop that is not `COMPLETED` may be reached, so a
        driver cannot jump ahead to a later passenger. Arriving at the *first*
        pickup is what moves the pool out of `DRIVER_EN_ROUTE`.
      operationId: arriveAtStop
      parameters:
        - name: poolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: stopId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The pool as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The stop is not the next actionable one, or the pool has not departed.

  /drivers/me/pools/{poolId}/stops/{stopId}/members/{memberId}/pickup:
    post:
      tags: [Trip]
      summary: Confirm a passenger is in the vehicle
      description: |
        The stop must be the next actionable one, a `PICKUP`, and **that
        passenger's own stop**, so a driver cannot complete somebody else's stop by
        naming the wrong member. A passenger collected during a trip that is
        already under way begins their ride immediately.
      operationId: pickUpMember
      parameters:
        - name: poolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: stopId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The pool as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The stop has not been reached, is not this passenger's, or the ride is not waiting to be collected.

  /drivers/me/pools/{poolId}/start:
    post:
      tags: [Trip]
      summary: Begin the journey with the passengers aboard
      description: |
        Requires `ARRIVED`, at least one passenger in the car, and **no pickup
        still open at the next actionable stop** — so a passenger waiting further
        along the route is still `MATCHED` and is collected into a running trip.
        This is also the operation that refuses without a frozen fare.
      operationId: startTrip
      parameters:
        - name: poolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The pool as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nobody is aboard, a pickup is still open, or the fare is not finalized.

  /drivers/me/pools/{poolId}/stops/{stopId}/members/{memberId}/dropoff:
    post:
      tags: [Trip]
      summary: Deliver a passenger
      description: |
        Completes **that passenger's** ride and no more: the pool carries on with
        whoever is still aboard, and is only `COMPLETED` when the last of them is
        delivered.
      operationId: dropOffMember
      parameters:
        - name: poolId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: stopId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The pool as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The passenger was not collected, the stop is not next, or the trip has not started.

  /drivers/me/pools/{poolId}/complete:
    post:
      tags: [Trip]
      summary: Finish the trip and release the driver
      description: |
        The only operation that is purely about facts, and it refuses if any is
        missing: every stop completed, nobody still in the car, every ride
        completed, and a fare frozen before the trip. It then sets the driver
        `ON_RIDE -> AVAILABLE` **at the final drop-off's service point**, so the
        next trip is dispatched from where this one ended.
      operationId: completeTrip
      parameters:
        - name: poolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The pool as it now stands, with the driver released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A stop is unfinished, a passenger is aboard, a ride is open, or the fare is not frozen.

  # -------------------------------------------------------------------------
  # TeslaPay
  # -------------------------------------------------------------------------
  /payments/me:
    get:
      tags: [TeslaPay]
      summary: What the caller owes, or is owed
      description: |
        The payments the caller is on either side of. A passenger sees the
        journeys they owe for and what they have settled; a driver sees the fares
        they have collected and those still outstanding. The role on the
        authenticated record decides which, so there is no parameter to choose a
        side and nothing in the path names a user.

        Every amount is an exact decimal string, like the rest of this API's
        money. `payable` is the server's answer to "should there be a Pay
        button", so a client does not derive it from `status`.

        The list is under `payments` rather than `data`: `side` and `totals`
        belong to the same response, and `data` is reserved for the responses
        that are nothing but a collection.
      operationId: listMyPayments
      parameters: []
      responses:
        '200':
          description: The caller's payments, and their totals.
          content:
            application/json:
              schema:
                type: object
                required: [side, payments, totals]
                properties:
                  side:
                    type: string
                    enum: [passenger, driver]
                    description: Which side of these payments the caller is on.
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        rideRequestId: { type: string, format: uuid }
                        ridePoolId: { type: string, format: uuid }
                        amount: { type: string }
                        currency: { type: string }
                        status: { type: string, enum: [PENDING, PAID] }
                        method: { type: string, nullable: true, enum: [TESLA_PAY, CASH] }
                        methodLabel: { type: string, nullable: true }
                        payable: { type: boolean }
                        settled: { type: boolean }
                        paidAt: { type: string, format: date-time, nullable: true }
                        createdAt: { type: string, format: date-time }
                        payerName: { type: string }
                        driverName: { type: string }
                        trip:
                          type: object
                          description: The journey this settles, when it comes from the list.
                          properties:
                            pickup: { type: string }
                            dropoff: { type: string }
                            poolStatus: { type: string }
                            completedAt: { type: string, format: date-time, nullable: true }
                  totals:
                    type: object
                    required: [outstanding, settled, total]
                    properties:
                      outstanding: { type: string }
                      settled: { type: string }
                      total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /payments/me/wallet:
    get:
      tags: [TeslaPay]
      summary: The caller's TeslaPay balance
      description: |
        The caller's balance and the movements that produced it, newest first.

        The balance is a cache and not the truth: it is derived from these
        entries, and the database refuses to commit the two disagreeing, so this
        number and the list beneath it cannot drift apart. An entry is either a
        settlement (`DEBIT` when someone paid, `CREDIT` when someone was paid) or
        a `TOP_UP`.
      operationId: getMyWallet
      parameters: []
      responses:
        '200':
          description: The wallet.
          content:
            application/json:
              schema:
                type: object
                required: [wallet]
                properties:
                  wallet:
                    type: object
                    required: [balance, currency, updatedAt, entries]
                    properties:
                      balance: { type: string }
                      currency: { type: string }
                      updatedAt: { type: string, format: date-time }
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            direction: { type: string, enum: [DEBIT, CREDIT] }
                            amount: { type: string }
                            balanceAfter: { type: string }
                            counterpartName: { type: string }
                            method: { type: string, nullable: true, enum: [TESLA_PAY, CASH] }
                            rideRequestId: { type: string, nullable: true, format: uuid }
                            createdAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /payments/rides/{rideRequestId}/pay:
    post:
      tags: [TeslaPay]
      summary: Settle a completed journey
      description: |
        Settles this passenger's own payment for one journey, from their TeslaPay
        balance or in cash.

        `TESLA_PAY` moves money: the passenger is debited and the driver credited,
        in one transaction. `CASH` records that the fare was handed over and moves
        nothing -- the money changed hands in the car, so writing a matching pair
        of ledger entries would invent money that never existed here.

        **A settlement happens exactly once.** Settling an already-settled payment
        returns it unchanged rather than failing, whatever method is asked for, so
        a retried request needs no special handling. The database enforces the same
        thing with one ledger entry per account per payment.

        A fare the balance cannot cover is refused with `409` and a sentence naming
        the shortfall, and nothing is written: the payment stays `PENDING` and can
        still be settled in cash.
      operationId: payForRide
      parameters:
        - name: rideRequestId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The journey being settled. It must be the caller's own; another passenger's is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              additionalProperties: false
              properties:
                method:
                  type: string
                  enum: [TESLA_PAY, CASH]
            examples:
              byBalance:
                summary: Pay from the TeslaPay balance
                value: { method: TESLA_PAY }
              inCash:
                summary: Record the fare as paid in cash
                value: { method: CASH }
      responses:
        '200':
          description: |
            The settled payment. `wallet` carries the payer's new balance so a
            client need not re-read the wallet; it is `null` for cash and for a
            repeat of a payment that was already settled.
          content:
            application/json:
              schema:
                type: object
                required: [payment, wallet, settled]
                properties:
                  payment:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      rideRequestId: { type: string, format: uuid }
                      ridePoolId: { type: string, format: uuid }
                      amount: { type: string }
                      currency: { type: string }
                      status: { type: string, enum: [PENDING, PAID] }
                      method: { type: string, nullable: true, enum: [TESLA_PAY, CASH] }
                      methodLabel: { type: string, nullable: true }
                      payable: { type: boolean }
                      settled: { type: boolean }
                      paidAt: { type: string, format: date-time, nullable: true }
                      createdAt: { type: string, format: date-time }
                      payerName: { type: string }
                      driverName: { type: string }
                  wallet:
                    type: object
                    nullable: true
                    properties:
                      balance: { type: string }
                      currency: { type: string }
                  settled:
                    type: boolean
                    description: False when this call settled nothing because it already had been.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The TeslaPay balance does not cover the fare. Nothing was written.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: teslab_auth
      description: |
        The signed JWT issued by `POST /api/auth/login` as an HttpOnly cookie. The
        cookie name is configurable (`AUTH_COOKIE_NAME`); `teslab_auth` is the
        default. Nothing is ever put in `localStorage`, and there is no bearer
        token.

  responses:
    BadRequest:
      description: |
        Malformed request: a bad uuid, an unknown status, an unknown query
        parameter, an unparseable date, or two mutually exclusive fields.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unknownStatus:
              value:
                error:
                  message: >-
                    status must be one of: WAITING, MATCHED, IN_PROGRESS,
                    COMPLETED, CANCELLED, EXPIRED
            unknownParameter:
              value:
                error: { message: 'Unsupported query parameter(s): passengerId. Supported: status, from, to, limit, offset' }
            badUuid:
              value:
                error: { message: 'rideRequestId must be a UUID' }
    Unauthenticated:
      description: No valid authentication, or a deactivated account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { message: Authentication required } }
    WrongRole:
      description: |
        Authenticated, but the wrong role for this endpoint — a driver calling a
        passenger endpoint, or a passenger calling a driver one. The only 403 in
        the API: a resource that belongs to somebody else is a 404.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { message: You do not have access to this resource } }
    NotFound:
      description: |
        No such resource, **or** a resource that is not the caller's. The two are
        deliberately the same answer, so an id cannot be probed for existence.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            ride:
              value: { error: { message: 'Ride "e0b2c1a4-0000-4000-8000-000000000000" was not found' } }
            pool:
              value: { error: { message: 'Ride pool "e0b2c1a4-0000-4000-8000-000000000000" was not found' } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: { type: string }
            details: { description: 'Present only for validation errors that carry a list.' }

    User:
      type: object
      description: A user as the (still public) user endpoints report them. Never the password hash.
      required: [id, name, email, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Nusrat Jahan }
        email: { type: string, format: email, example: nusrat@example.com }
        role: { type: string, enum: [PASSENGER, DRIVER, ADMIN] }
        active: { type: boolean }

    AuthenticatedUser:
      type: object
      description: |
        The authenticated user, as `/auth/me` and the sign-in endpoints report them.
        The role is read from the database on every request, never from the token.
      required: [id, name, email, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Jashim Uddin }
        email: { type: string, format: email, example: jashim@example.com }
        role: { type: string, enum: [PASSENGER, DRIVER, ADMIN] }
        active: { type: boolean }

    Zone:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: banani }
        name: { type: string, example: Banani }
        active: { type: boolean }

    RouteEstimate:
      type: object
      description: A routed journey between two service points.
      properties:
        origin: { $ref: '#/components/schemas/ServicePoint' }
        destination: { $ref: '#/components/schemas/ServicePoint' }
        distanceMeters: { type: integer, example: 2214 }
        durationSeconds: { type: integer, example: 569 }
        trafficProfile: { type: string, enum: [NORMAL, RUSH_HOUR] }
        edges:
          type: array
          items:
            type: object
            properties:
              fromCode: { type: string }
              toCode: { type: string }
              distanceMeters: { type: integer }

    FareQuote:
      type: object
      description: A solo fare quote, frozen at the instant it was priced.
      properties:
        id: { type: string, format: uuid }
        fare: { type: string, description: 'A whole number of taka: every fare is rounded to the policy''s unit.', example: '130' }
        currency: { type: string, example: BDT }
        distanceMeters: { type: integer, example: 2214 }
        durationSeconds: { type: integer, example: 569 }
        pricingCode: { type: string, example: dhaka-solo }
        pricingVersion: { type: integer, example: 1 }
        fareBreakdown:
          type: object
          properties:
            baseFare: { type: string, example: '40.00' }
            distanceFare: { type: string }
            timeFare: { type: string }
            trafficMultiplier: { type: string, example: '1.10' }
            roundingScale: { type: integer, example: 2 }
        expiresAt: { type: string, format: date-time }

    PassengerFare:
      type: object
      description: |
        One passenger's own pooled fare, and the rules that produced it. Derived
        from a single allocation, so there is no shape of it in which another
        passenger's fare could appear.
      properties:
        rideRequestId: { type: string, format: uuid }
        fareStatus: { type: string, enum: [ESTIMATED, FINALIZED] }
        calculationStatus: { type: string, enum: [CURRENT, SUPERSEDED, FINALIZED] }
        currency: { type: string, example: BDT }
        acceptedSoloFare:
          type: string
          description: The quote this passenger accepted, as a whole number of taka.
          example: '130'
        currentPooledFare:
          type: string
          description: What this passenger owes now, as a whole number of taka.
          example: '130'
        baseFare: { type: string, example: '40.00' }
        allocatedLegCost: { type: string, example: '86.63' }
        uncappedPooledFare: { type: string, example: '126.63' }
        minimumFare: { type: string, example: '80.00' }
        minimumFareApplied: { type: boolean }
        unroundedFare:
          type: string
          description: '`currentPooledFare` before the rounding to whole taka. A component, so it keeps the policy''s decimals.'
          example: '126.63'
        fareRoundingAdjustment:
          type: string
          description: 'Signed: `currentPooledFare - unroundedFare`. What the rounding to the unit moved, at most half a unit in either direction.'
          example: '3.37'
        legsPaidFor: { type: integer, example: 1 }
        previousPooledFare: { type: string, nullable: true }
        soloCapApplied: { type: boolean }
        noIncreaseCapApplied: { type: boolean }
        soloCapReduction: { type: string, example: '0.00' }
        noIncreaseReduction: { type: string, example: '0.00' }
        totalReduction: { type: string, example: '0.00' }
        savedAgainstSoloFare: { type: string, example: '0' }
        pricingCode: { type: string, example: dhaka-solo }
        pricingVersion: { type: integer, example: 1 }
        sharedFareRuleVersion: { type: string, example: pool-leg-share-v2 }
        poolVersion: { type: integer, example: 1 }
        calculatedAt: { type: string, format: date-time }

    RideRequestWithTrip:
      type: object
      description: |
        A ride request as its own passenger sees it, plus the `trip` block once it
        is matched. `trip` is `null` before that and is left out of list pages.
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RideRequestStatus' }
        cancellable: { type: boolean }
        pickup: { $ref: '#/components/schemas/ServicePoint' }
        destination: { $ref: '#/components/schemas/ServicePoint' }
        acceptedQuote:
          type: object
          properties:
            fareQuoteId: { type: string, format: uuid }
            fare: { type: string, description: 'A whole number of taka: every fare is rounded to the policy''s unit.', example: '130' }
            currency: { type: string, example: BDT }
            pricingCode: { type: string, example: dhaka-solo }
            pricingVersion: { type: integer, example: 1 }
            distanceMeters: { type: integer, example: 2214 }
            durationSeconds: { type: integer, example: 569 }
        requestedAt: { type: string, format: date-time }
        searchExpiresAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancellationReason: { type: string, nullable: true }
        trip:
          description: |
            This passenger's own part of the trip. `null` before a match. Identical
            in shape to the `trip` fields of a `CurrentRide`, minus the summary.
          oneOf:
            - $ref: '#/components/schemas/PassengerTripBlock'
            - type: 'null'

    PassengerTripBlock:
      type: object
      properties:
        poolId: { type: string, format: uuid }
        poolStatus: { $ref: '#/components/schemas/RidePoolStatus' }
        memberStatus: { $ref: '#/components/schemas/PoolMemberStatus' }
        stage: { $ref: '#/components/schemas/PassengerStage' }
        driver:
          oneOf:
            - $ref: '#/components/schemas/DriverPublicSummary'
            - type: 'null'
        vehicle:
          oneOf:
            - $ref: '#/components/schemas/VehiclePublicSummary'
            - type: 'null'
        stops: { type: array, items: { $ref: '#/components/schemas/Stop' } }
        nextStop:
          oneOf:
            - $ref: '#/components/schemas/Stop'
            - type: 'null'
        timeline:
          type: object
          properties:
            matchedAt: { type: string, format: date-time, nullable: true }
            departedAt: { type: string, format: date-time, nullable: true }
            driverArrivedAt: { type: string, format: date-time, nullable: true }
            pickedUpAt: { type: string, format: date-time, nullable: true }
            droppedOffAt: { type: string, format: date-time, nullable: true }
        events: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }

    DispatchOffer:
      type: object
      description: |
        A dispatch offer, as the driver it was made to sees it. The candidate score
        and the other drivers considered are never included.
      properties:
        offerId: { type: string, format: uuid }
        offerType: { type: string, enum: [INITIAL_RIDE, ADD_PASSENGER] }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, EXPIRED, CANCELLED] }
        rideRequestId: { type: string, format: uuid }
        ridePoolId: { type: string, format: uuid, nullable: true }
        poolVersion: { type: integer, nullable: true }
        expiresAt: { type: string, format: date-time }
        offeredAt: { type: string, format: date-time }
        pickup: { $ref: '#/components/schemas/ServicePoint' }
        destination: { $ref: '#/components/schemas/ServicePoint' }
        approach:
          type: object
          description: How the driver was measured to reach the pickup.
          properties:
            fromServicePointCode: { type: string, example: banani-kakoli }
            distanceMeters: { type: integer }
            durationSeconds: { type: integer }
        rejectionReason: { type: string, nullable: true }

    PoolEnvelope:
      type: object
      description: Every trip command answers with the pool as it now stands after the change.
      required: [pool]
      properties:
        pool: { $ref: '#/components/schemas/Pool' }

    Pagination:
      type: object
      required: [pagination]
      properties:
        pagination:
          type: object
          required: [limit, offset, returned, total, hasMore]
          properties:
            limit: { type: integer, description: The page size used. }
            offset: { type: integer, description: The offset used. }
            returned: { type: integer, description: How many rows this page holds. }
            total: { type: integer, description: How many rows match the filter in total. }
            hasMore: { type: boolean, description: Whether `offset + returned < total`. }

    ServicePoint:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: banani-road-11 }
        name: { type: string, example: Banani Road 11 }

    ServicePointWithId:
      allOf:
        - $ref: '#/components/schemas/ServicePoint'
        - type: object
          properties:
            id: { type: string, format: uuid }

    RideRequestStatus:
      type: string
      description: |
        `WAITING` → `MATCHED` → `IN_PROGRESS` → `COMPLETED`, or `CANCELLED` /
        `EXPIRED` from `WAITING`. The three middle values are the "active" ones.
      enum: [WAITING, MATCHED, IN_PROGRESS, COMPLETED, CANCELLED, EXPIRED]

    RidePoolStatus:
      type: string
      description: |
        `FORMING` → `DRIVER_EN_ROUTE` → `ARRIVED` → `IN_PROGRESS` → `COMPLETED`.
        A pool that is no longer `FORMING` is closed to matching. `CANCELLED` is
        defined and not yet reached.
      enum: [FORMING, DRIVER_EN_ROUTE, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]

    PoolMemberStatus:
      type: string
      description: |
        `ASSIGNED` → `PICKED_UP` → `DROPPED_OFF`. `CANCELLED` and `NO_SHOW` are
        reserved.
      enum: [ASSIGNED, PICKED_UP, DROPPED_OFF, CANCELLED, NO_SHOW]

    PoolStopStatus:
      type: string
      description: '`PENDING` → `ARRIVED` → `COMPLETED`. `SKIPPED` is reserved.'
      enum: [PENDING, ARRIVED, COMPLETED, SKIPPED]

    StopType:
      type: string
      enum: [PICKUP, DROPOFF]

    PassengerStage:
      type: string
      description: |
        Where the passenger is in their own journey, derived from their own
        timestamps rather than stored.

        | Stage | Means |
        | ----- | ----- |
        | `DRIVER_ASSIGNED` | A driver accepted; nobody has set off |
        | `DRIVER_EN_ROUTE` | The driver left for the first pickup |
        | `DRIVER_ARRIVED` | The car is at *this* passenger's pickup |
        | `PICKED_UP` | This passenger is in the car; the trip has not started |
        | `IN_PROGRESS` | This passenger's ride has begun |
        | `RIDE_COMPLETED` | This passenger has been delivered |
      enum: [DRIVER_ASSIGNED, DRIVER_EN_ROUTE, DRIVER_ARRIVED, PICKED_UP, IN_PROGRESS, RIDE_COMPLETED]

    PassengerNextAction:
      type: string
      description: |
        The single thing a passenger's client should offer next. Computed on the
        server from the stage, so a client never derives it.

        | Action | Offer |
        | ------ | ----- |
        | `WAIT_FOR_DRIVER` | Nothing; keep waiting |
        | `WATCH_DRIVER` | A map of the approaching car |
        | `BOARD_VEHICLE` | "Your car is here" |
        | `IN_RIDE` | Nothing; the ride is happening |
        | `RIDE_FINISHED` | The trip summary |
      enum: [WAIT_FOR_DRIVER, WATCH_DRIVER, BOARD_VEHICLE, IN_RIDE, RIDE_FINISHED]

    SoloEstimate:
      type: object
      description: The solo fare the passenger accepted when the request was made, frozen.
      required: [fare, currency, pricingCode, pricingVersion]
      properties:
        fare: { type: string, description: 'A whole number of taka: every fare is rounded to the policy''s unit.', example: '130' }
        currency: { type: string, example: BDT }
        pricingCode: { type: string, example: dhaka-solo }
        pricingVersion: { type: integer, example: 1 }

    SharedFareSummary:
      type: object
      description: |
        This passenger's own pooled fare. `null` before a match — a passenger who
        is not sharing anything has no pooled fare, and `"0.00"` would be inventing
        an answer.
      required: [fare, currency, finalized, poolVersion]
      properties:
        fare: { type: string, description: 'What this passenger is charged, as a whole number of taka.', example: '130' }
        currency: { type: string, example: BDT }
        finalized:
          type: boolean
          description: True once the driver has departed, which freezes the fare.
        poolVersion: { type: integer, example: 1 }

    DriverPublicSummary:
      type: object
      description: |
        A driver as a passenger may know them: a first name. Not their user id,
        their email, or any contact detail.
      properties:
        displayName: { type: string, nullable: true, example: Jashim }

    VehiclePublicSummary:
      type: object
      properties:
        name: { type: string, example: Bullet }
        seatCapacity: { type: integer, example: 3 }

    Stop:
      type: object
      description: |
        One stop of a plan. A stop names **one member and one type**, so two
        passengers collected at the same corner are two consecutive stops.
      required: [stopId, sequence, stopType, status]
      properties:
        stopId: { type: string, format: uuid }
        sequence: { type: integer, description: 'The order it is driven in. 1 is first.' }
        stopType: { $ref: '#/components/schemas/StopType' }
        status: { $ref: '#/components/schemas/PoolStopStatus' }
        servicePoint: { $ref: '#/components/schemas/ServicePoint' }
        plannedArrivalAt: { type: string, format: date-time, nullable: true }
        actualArrivalAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    PoolStop:
      allOf:
        - $ref: '#/components/schemas/Stop'
        - type: object
          properties:
            poolMemberId: { type: string, format: uuid }

    TimelineEntry:
      type: object
      description: |
        One event from the append-only history, as a sentence. Produced by
        `timeline.rules.js`, which drops any event whose type is not on a
        whitelist for this audience and never reads the event's `metadata`. An
        internal event type therefore cannot leak by being added to the enum.
      required: [sequence, eventType, phase, label, at]
      properties:
        sequence: { type: integer, description: 'Per request or per pool; the order things happened in.' }
        eventType: { type: string, example: DRIVER_DEPARTED }
        phase:
          type: string
          description: Coarse grouping, so a client can build sections without parsing labels.
          enum: [REQUEST, MATCHING, PICKUP, RIDE, END]
        label: { type: string, description: 'A sentence for a human.', example: 'Your driver set off' }
        actorType: { type: string, enum: [PASSENGER, DRIVER, SYSTEM, ADMIN], nullable: true }
        at: { type: string, format: date-time, nullable: true }

    RideSummary:
      type: object
      description: One row of the passenger's history.
      required: [rideRequestId, status, pickup, destination, requestedAt]
      properties:
        rideRequestId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RideRequestStatus' }
        cancellable: { type: boolean, description: 'Derived: true exactly while the status is WAITING.' }
        pickup: { $ref: '#/components/schemas/ServicePoint' }
        destination: { $ref: '#/components/schemas/ServicePoint' }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true, description: 'This ride began.' }
        completedAt: { type: string, format: date-time, nullable: true, description: 'This ride ended.' }
        cancelledAt: { type: string, format: date-time, nullable: true }
        route:
          type: object
          description: The route the accepted quote priced.
          properties:
            distanceMeters: { type: integer, example: 2214 }
            durationSeconds: { type: integer, example: 569 }
        soloEstimate: { $ref: '#/components/schemas/SoloEstimate' }
        sharedFare:
          oneOf:
            - $ref: '#/components/schemas/SharedFareSummary'
            - type: 'null'
        driver:
          oneOf:
            - $ref: '#/components/schemas/DriverPublicSummary'
            - type: 'null'
        vehicle:
          oneOf:
            - $ref: '#/components/schemas/VehiclePublicSummary'
            - type: 'null'
        passengerCount:
          type: integer
          nullable: true
          description: 'Aggregate only: how many people shared the car. No row behind this is read.'

    CurrentRide:
      allOf:
        - $ref: '#/components/schemas/RideSummary'
        - type: object
          required: [stage, nextAction]
          properties:
            stage: { $ref: '#/components/schemas/PassengerStage' }
            nextAction: { $ref: '#/components/schemas/PassengerNextAction' }
            searchExpiresAt:
              type: string
              format: date-time
              description: 'When a WAITING request stops looking for a driver.'
            memberStatus:
              oneOf:
                - $ref: '#/components/schemas/PoolMemberStatus'
                - type: 'null'
            pool:
              oneOf:
                - type: object
                  properties:
                    poolId: { type: string, format: uuid }
                    status: { $ref: '#/components/schemas/RidePoolStatus' }
                    completedAt: { type: string, format: date-time, nullable: true }
                - type: 'null'
            timeline:
              type: object
              description: The passenger's own instants, so a tracker needs no date arithmetic.
              properties:
                matchedAt: { type: string, format: date-time, nullable: true }
                departedAt: { type: string, format: date-time, nullable: true }
                driverArrivedAt: { type: string, format: date-time, nullable: true }
                pickedUpAt: { type: string, format: date-time, nullable: true }
                droppedOffAt: { type: string, format: date-time, nullable: true }
            myStops:
              type: array
              description: This passenger's own stops — at most two, and never a co-passenger's.
              items: { $ref: '#/components/schemas/Stop' }

    RideDetail:
      allOf:
        - $ref: '#/components/schemas/RideSummary'
        - type: object
          required: [stage, nextAction, myStops, timeline]
          properties:
            stage: { $ref: '#/components/schemas/PassengerStage' }
            nextAction: { $ref: '#/components/schemas/PassengerNextAction' }
            searchExpiresAt: { type: string, format: date-time }
            memberStatus:
              oneOf:
                - $ref: '#/components/schemas/PoolMemberStatus'
                - type: 'null'
            myStops:
              type: array
              items: { $ref: '#/components/schemas/Stop' }
            sharedRoute:
              type: object
              nullable: true
              description: The pool's planned route once matched; null before that.
              properties:
                distanceMeters: { type: integer }
                durationSeconds: { type: integer }
            pool:
              oneOf:
                - type: object
                  properties:
                    poolId: { type: string, format: uuid }
                    status: { $ref: '#/components/schemas/RidePoolStatus' }
                    passengerCount: { type: integer }
                    capacity: { type: integer }
                    completedAt: { type: string, format: date-time, nullable: true }
                - type: 'null'
            member:
              oneOf:
                - type: object
                  properties:
                    memberStatus: { $ref: '#/components/schemas/PoolMemberStatus' }
                    matchedAt: { type: string, format: date-time, nullable: true }
                    pickedUpAt: { type: string, format: date-time, nullable: true }
                    droppedOffAt: { type: string, format: date-time, nullable: true }
                - type: 'null'
            timeline:
              type: array
              description: |
                This passenger's lifecycle, with every dispatch event removed and
                no event payload included. Ordered by sequence, then timestamp.
              items: { $ref: '#/components/schemas/TimelineEntry' }

    DriverAvailability:
      type: object
      required: [driverProfileId, status, online, operationalStatus, canGoOnline, canGoOffline]
      properties:
        driverProfileId: { type: string, format: uuid, description: 'The driver''s own profile. Never a user id or an email.' }
        status: { $ref: '#/components/schemas/DriverOperationalStatus' }
        online:
          type: boolean
          description: 'False exactly when the status is OFFLINE. The value a toggle binds to.'
        operationalStatus: { $ref: '#/components/schemas/DriverOperationalStatus' }
        currentServicePoint:
          oneOf:
            - $ref: '#/components/schemas/ServicePoint'
            - type: 'null'
        servicePoint:
          oneOf:
            - $ref: '#/components/schemas/ServicePointWithId'
            - type: 'null'
        vehicle:
          oneOf:
            - type: object
              properties:
                vehicleId: { type: string, format: uuid }
                name: { type: string, example: Bullet }
                seatCapacity: { type: integer, example: 3 }
            - type: 'null'
        vehicles:
          type: array
          description: The driver's own active vehicles, so one with several knows what to pick.
          items:
            type: object
            properties:
              vehicleId: { type: string, format: uuid }
              name: { type: string }
              seatCapacity: { type: integer }
        availableSince: { type: string, format: date-time, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        canGoOnline: { type: boolean, description: 'Derived, so a client shows only buttons the server would accept.' }
        canGoOffline: { type: boolean, description: 'False while RESERVED or ON_RIDE.' }
        updatedAt: { type: string, format: date-time }

    DriverOperationalStatus:
      type: string
      description: |
        `OFFLINE` is excluded from dispatch. `RESERVED` means an accepted pool
        whose trip has not departed; `ON_RIDE` means a passenger is in the car.
        Neither can be set through the API — they are established by accepting an
        offer and departing.
      enum: [OFFLINE, AVAILABLE, RESERVED, ON_RIDE]

    AvailabilityRequest:
      type: object
      required: [online]
      additionalProperties: false
      properties:
        online: { type: boolean, description: 'true to take work, false to stop.' }
        servicePointCode:
          type: string
          description: 'Required when going online (unless servicePointId is given). A stable code.'
          example: banani-kakoli
        servicePointId:
          type: string
          format: uuid
          description: 'Required when going online (unless servicePointCode is given). Mutually exclusive with it.'
        vehicleId:
          type: string
          format: uuid
          description: 'Required only when the driver has more than one active vehicle.'

    PoolMemberForDriver:
      type: object
      description: |
        A passenger, as the driver operating the ride may know them: a first name
        and their own two places. No account field, no fare.
      properties:
        memberId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PoolMemberStatus' }
        rideStatus: { $ref: '#/components/schemas/RideRequestStatus' }
        displayName: { type: string, nullable: true, example: Nusrat }
        pickup: { $ref: '#/components/schemas/ServicePoint' }
        dropoff: { $ref: '#/components/schemas/ServicePoint' }
        matchedAt: { type: string, format: date-time, nullable: true }
        pickedUpAt: { type: string, format: date-time, nullable: true }
        droppedOffAt: { type: string, format: date-time, nullable: true }

    Pool:
      type: object
      description: |
        The pool a driver is currently committed to. `pricing` reports whether the
        fare is settled, never an amount: mid-trip a driver's decision about where
        to go next must not depend on what a passenger is paying.
      required: [poolId, status, allowedActions, pricing]
      properties:
        poolId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RidePoolStatus' }
        version: { type: integer }
        capacity: { type: integer }
        vehicle:
          oneOf:
            - $ref: '#/components/schemas/VehiclePublicSummary'
            - type: 'null'
        plan:
          type: object
          properties:
            distanceMeters: { type: integer }
            durationSeconds: { type: integer }
            stopCount: { type: integer }
        stops:
          type: array
          items: { $ref: '#/components/schemas/Stop' }
        nextStop:
          oneOf:
            - $ref: '#/components/schemas/Stop'
            - type: 'null'
        allowedActions:
          type: array
          description: |
            The commands that would succeed right now, computed from the state. An
            action is absent when its command would be refused, so a client renders
            these rather than deciding.
          items:
            type: string
            enum: [DEPART, ARRIVE_AT_STOP, PICKUP_PASSENGER, START_TRIP, DROPOFF_PASSENGER, COMPLETE_TRIP]
        pricing:
          type: object
          properties:
            finalized: { type: boolean }
            finalizedAt: { type: string, format: date-time, nullable: true }
            poolVersion: { type: integer, nullable: true }
        departedAt: { type: string, format: date-time, nullable: true }
        driverArrivedAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        acceptedAt: { type: string, format: date-time }
        members:
          type: array
          items: { $ref: '#/components/schemas/PoolMemberForDriver' }
        events:
          type: array
          description: The pool's own audit trail, without any event payload.
          items:
            type: object
            properties:
              sequence: { type: integer }
              eventType: { type: string }
              actorType: { type: string }
              createdAt: { type: string, format: date-time }

    PoolFareSummary:
      type: object
      description: |
        The pool's fare, as the driver's history reports it. **Totals only**: there
        is no per-passenger breakdown, because attributing an amount to a named
        person would disclose what that passenger was charged.
      properties:
        fareStatus: { type: string, enum: [ESTIMATED, FINALIZED] }
        finalized: { type: boolean, description: 'True once the driver departed, which freezes it.' }
        finalizedAt: { type: string, format: date-time, nullable: true }
        currency: { type: string, example: BDT }
        poolVersion: { type: integer }
        totalPassengerFare: { type: string, description: 'Every passenger in the pool, added up. A whole number of taka, like every fare.', example: '130' }

    DriverRideSummary:
      type: object
      description: One row of the driver's history. Counts, not rows.
      required: [poolId, status, route, passengerCount, stopCount, completedStopCount]
      properties:
        poolId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RidePoolStatus' }
        vehicle:
          oneOf:
            - type: object
              properties:
                vehicleId: { type: string, format: uuid }
                name: { type: string, example: Bullet }
                seatCapacity: { type: integer, example: 3 }
            - type: 'null'
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        firstServicePoint:
          oneOf:
            - $ref: '#/components/schemas/ServicePoint'
            - type: 'null'
        finalServicePoint:
          oneOf:
            - $ref: '#/components/schemas/ServicePoint'
            - type: 'null'
        route:
          type: object
          properties:
            distanceMeters: { type: integer, example: 2214 }
            durationSeconds: { type: integer, example: 569 }
        passengerCount: { type: integer, example: 1 }
        stopCount: { type: integer, example: 2 }
        completedStopCount: { type: integer, example: 2 }
        fare:
          oneOf:
            - $ref: '#/components/schemas/PoolFareSummary'
            - type: 'null'

    DriverRideDetail:
      type: object
      required: [poolId, status, stops, passengers, allowedActions, timeline]
      properties:
        poolId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RidePoolStatus' }
        version: { type: integer }
        capacity: { type: integer }
        vehicle:
          oneOf:
            - type: object
              properties:
                vehicleId: { type: string, format: uuid }
                name: { type: string }
                seatCapacity: { type: integer }
            - type: 'null'
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
        departedAt: { type: string, format: date-time, nullable: true }
        driverArrivedAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        route:
          type: object
          properties:
            distanceMeters: { type: integer }
            durationSeconds: { type: integer }
        stops:
          type: array
          items: { $ref: '#/components/schemas/PoolStop' }
        nextStop:
          oneOf:
            - $ref: '#/components/schemas/PoolStop'
            - type: 'null'
        passengers:
          type: array
          items: { $ref: '#/components/schemas/PoolMemberForDriver' }
        passengerCount: { type: integer }
        fare:
          oneOf:
            - $ref: '#/components/schemas/PoolFareSummary'
            - type: 'null'
        allowedActions:
          type: array
          description: Empty for a finished pool, so a history detail and a live pool answer alike.
          items:
            type: string
            enum: [DEPART, ARRIVE_AT_STOP, PICKUP_PASSENGER, START_TRIP, DROPOFF_PASSENGER, COMPLETE_TRIP]
        timeline:
          type: array
          description: The pool's lifecycle, mapped from `pool_events` with no payload included.
          items: { $ref: '#/components/schemas/TimelineEntry' }

# ---------------------------------------------------------------------------
# The rest of the API, in outline.
#
# These are described in full in `README.md`, one section per milestone. They are
# listed here so a reader can see the whole surface, and so this document does not
# pretend the read APIs are all there is.
# ---------------------------------------------------------------------------
x-related-endpoints:
  authentication:
    - { method: POST, path: /auth/register, operation: 'Sign up as a PASSENGER or DRIVER; signs in.' }
    - { method: POST, path: /auth/login, operation: 'Log in; sets the auth cookie.' }
    - { method: GET, path: /auth/me, operation: 'The authenticated user.' }
    - { method: POST, path: /auth/logout, operation: 'Clear the auth cookie. Safe to retry.' }
  location:
    - { method: GET, path: /location/zones, operation: 'The active service zones.' }
    - { method: GET, path: /location/points, operation: 'Active service points, optional ?zoneCode=.' }
    - { method: GET, path: /location/points/{code}, operation: 'One service point by code.' }
  routingAndPricing:
    - { method: POST, path: /routes/estimate, operation: 'Estimate a route between two service points.' }
    - { method: POST, path: /fare-quotes, operation: 'Quote a solo fare in BDT. PASSENGER only.' }
  rideRequests:
    - { method: POST, path: /ride-requests, operation: 'Ask for a ride from a quote the caller owns.' }
    - { method: GET, path: /ride-requests/my, operation: 'The caller''s own requests, newest first, paged.' }
    - { method: GET, path: /ride-requests/{id}, operation: 'One of the caller''s own requests, with the trip block.' }
    - { method: POST, path: /ride-requests/{id}/cancel, operation: 'Cancel a request that is still WAITING.' }
    - { method: GET, path: /ride-requests/{id}/fare, operation: 'The caller''s own shared fare, with its breakdown.' }
  dispatch:
    - { method: GET, path: /drivers/me/offers, operation: 'The driver''s own dispatch offers, both kinds.' }
    - { method: GET, path: /drivers/me/offers/{offerId}, operation: 'One of the driver''s own offers.' }
    - { method: POST, path: /drivers/me/offers/{offerId}/accept, operation: 'Accept an offer. No body.' }
    - { method: POST, path: /drivers/me/offers/{offerId}/reject, operation: 'Refuse an offer.' }
    - { method: POST, path: /drivers/me/online, operation: 'Go online. Superseded by PATCH /drivers/me/availability, still supported.' }
    - { method: POST, path: /drivers/me/offline, operation: 'Go offline. Superseded by PATCH /drivers/me/availability, still supported.' }
    - { method: PUT, path: /drivers/me/current-service-point, operation: 'Move to another service point.' }
  trip:
    - { method: POST, path: /drivers/me/pools/{poolId}/depart, operation: 'Set off; closes the pool to matching and freezes the fare.' }
    - { method: POST, path: /drivers/me/pools/{poolId}/stops/{stopId}/arrive, operation: 'Reach the next actionable stop.' }
    - { method: POST, path: /drivers/me/pools/{poolId}/stops/{stopId}/members/{memberId}/pickup, operation: 'Confirm a passenger is in the car.' }
    - { method: POST, path: /drivers/me/pools/{poolId}/start, operation: 'Begin the journey with the passengers aboard.' }
    - { method: POST, path: /drivers/me/pools/{poolId}/stops/{stopId}/members/{memberId}/dropoff, operation: 'Deliver a passenger.' }
    - { method: POST, path: /drivers/me/pools/{poolId}/complete, operation: 'Finish the trip and release the driver.' }
    - { method: GET, path: /drivers/me/pool, operation: 'Alias of /drivers/me/current-pool.' }
  operational:
    - { method: GET, path: /health, operation: 'Service status, uptime and a database probe.' }
    - { method: GET, path: /users, operation: 'List users. Still public; see README.' }
