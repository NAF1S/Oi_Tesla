openapi: 3.1.0

# ---------------------------------------------------------------------------
# TeslaB — the read APIs the passenger and driver clients are built on.
#
# WHY THIS FILE EXISTS AND WHAT IT COVERS
#
# The project's primary documentation is `README.md`, which explains *why* each
# milestone is shaped the way it is. This file is the machine-readable contract:
# paths, parameters, status codes and response shapes, so a client generator or an
# editor can work from the API rather than from prose.
#
# It documents the **passenger and driver read APIs** — current ride, ride
# history, ride detail, current pool, driver history, and driver availability —
# because those are the endpoints a frontend is built on and the ones added by the
# read-API milestone. The write endpoints are described in outline under
# `x-related-endpoints` at the bottom so the picture is complete; their detailed
# schemas live in `README.md`, and this file grows to cover them rather than
# guessing at them.
#
# The examples use the demo cast (`02-seed.sql`): Nusrat and Rafiq travel, Jashim
# drives, and the Banani Road 11 → Mohakhali Bus Terminal journey is the reference
# trip (2214 m, 569 s at rush hour, BDT 130 quoted solo -- 118.75 of subtotal plus
# 11.88 of peak adjustment, rounded to a whole number of 10 taka).
# ---------------------------------------------------------------------------

info:
  title: TeslaB API
  version: 1.0.0
  description: |
    A ride-pooling API: passengers request journeys between service points, the
    dispatcher matches them into pools, and drivers execute the trip.

    ## Authentication

    Authentication is a **signed JWT carried in an HttpOnly cookie**. Sign in with
    `POST /api/auth/login`; the cookie is set on the response and every subsequent
    request must carry it. There is no `Authorization` header and no token in a
    response body — a browser client does nothing, and a non-browser client keeps
    the cookie jar.

    ```bash
    curl -c cookies.txt -X POST localhost:4000/api/auth/login \
      -H 'Content-Type: application/json' \
      -d '{"email":"nusrat@example.com","password":"DemoPass123!"}'

    curl -b cookies.txt localhost:4000/api/passengers/me/current-ride
    ```

    The token names a user; the **role is read from the database on every
    request**, so a changed role or a deactivated account takes effect immediately
    rather than when the token expires.

    ## Roles

    | Role | May use |
    | ---- | ------- |
    | `PASSENGER` | `/api/passengers/**`, `/api/ride-requests/**`, `/api/fare-quotes` |
    | `DRIVER` | `/api/drivers/**` |
    | `ADMIN` | `/api/users` |

    ## Ownership, and why a missing ride is a 404 and not a 403

    Every `*/me` path answers about the authenticated user. No path, query
    parameter or body field names a passenger or a driver, so acting as somebody
    else is not a request a client can construct.

    Where a client *does* name a resource — `rideRequestId`, `poolId` — the id is
    checked against the caller's own rows. A resource that belongs to somebody else
    answers **404**, the same as an id that does not exist. A 403 would confirm
    that the id is real, which is itself information about another person. The one
    place a 403 appears is the role guard: "authenticated, but not this kind of
    user".

    ## Pagination

    List endpoints use `limit` + `offset`, newest first, with a stable
    tie-breaker:

    ```text
    ORDER BY created_at DESC, id DESC      (driver history, by pool)
    ORDER BY requested_at DESC, id DESC    (passenger history, by request)
    ```

    The tie-breaker is not cosmetic. Two rows written in the same millisecond have
    no inherent order, so without it a client paging through them would see one
    twice and miss another. With it the order is total, and page N+1 starts exactly
    where page N stopped.

    Every list answers with the same envelope:

    ```json
    {
      "data": [ … ],
      "pagination": { "limit": 20, "offset": 0, "returned": 20, "total": 57, "hasMore": true }
    }
    ```

    `total` is the count of everything matching the filter, not of the page, so a
    client can render "page 1 of 3" without a second call. `limit` is capped
    (100 for history), and a value outside its range is a 400 rather than being
    clamped silently.

    ## Empty states

    Three different things, and the API keeps them apart on purpose:

    | Situation | Answer |
    | --------- | ------ |
    | The passenger is not on a ride | `200` with `{ "ride": null }` |
    | The driver has no active pool | `200` with `{ "pool": null }` |
    | A history has no matching rows | `200` with `"data": []` and `"total": 0` |
    | A named ride or pool is not the caller's | `404` |
    | There is no shared fare for a request | `404` (not `0.00`) |

    "You have no current ride" is a normal state, not a missing resource, so it is
    a 200. A named resource that cannot be found *is* missing, so it is a 404.
    Reporting a passenger's uncalculated fare as `0.00` would be inventing an
    answer, so it is a 404 as well.

    ## Errors

    Every error has one shape, and a database error never reaches a client:

    ```json
    { "error": { "message": "Ride \"e0b2…\" was not found" } }
    ```

    | Status | Meaning |
    | ------ | ------- |
    | `400` | Malformed: bad uuid, unknown status, unknown query parameter, unparseable date, a date range that cannot be satisfied |
    | `401` | No valid authentication |
    | `403` | Authenticated, but the wrong role |
    | `404` | Not found, or not yours |
    | `409` | The request conflicts with the current state |
    | `500` | Unexpected; the message is generic in production |

    Unknown query parameters are rejected rather than ignored. `?passengerId=…` is
    a 400 with the supported list, so a client learns that this API does not work
    that way instead of silently reading somebody else's data or its own.

servers:
  - url: http://localhost:4000/api
    description: Local development (the API and the client together via `npm run dev`)

tags:
  - name: Passenger reads
    description: |
      The ride a passenger is on, their history, and one ride in detail.
      All require the `PASSENGER` role and answer only about the caller.
  - name: Driver availability
    description: |
      Whether a driver is taking work, and where they are. The driver is taken
      from the session; no endpoint accepts a driver id.
  - name: Driver reads
    description: |
      The pool a driver is committed to, and the pools they have driven. All
      require the `DRIVER` role and answer only about the caller.
  - name: Documentation
    description: This document.
  - name: TeslaPay
    description: |
      The simulated wallet: what a caller owes or is owed, their balance, and
      settling a completed journey from the balance or in cash.

security:
  - cookieAuth: []

paths:
  # -------------------------------------------------------------------------
  # Passenger reads
  # -------------------------------------------------------------------------
  /passengers/me/current-ride:
    get:
      tags: [Passenger reads]
      summary: The passenger's current ride
      description: |
        The passenger's single active ride request, with everything a client needs
        to render the journey: where the car is in the plan, this passenger's own
        two stops, who is driving, and what they may do next.

        "Active" means `WAITING`, `MATCHED` or `IN_PROGRESS` — the statuses in
        which a ride is still happening. At most one can exist at a time
        (`one_active_ride_request_per_passenger`), so this is never a choice among
        candidates.

        **Nothing about another passenger is returned.** The pool is reached
        through this passenger's own member row, so a co-passenger's name, request
        id, places, fare and event history are not merely filtered out — they are
        never read. What is shared is aggregate: `passengerCount` and the vehicle's
        `seatCapacity`.

        `stage` and `nextAction` are computed on the server from the request's own
        timestamps, so a client never reimplements the state machine and cannot
        disagree with the server about which button to show.
      operationId: getCurrentRide
      parameters: []
      responses:
        '200':
          description: |
            The active ride, or `null` when there is none. Not being on a ride is a
            normal state, so this is never a 404 — a client polling this endpoint
            should not have to treat the ordinary answer as an error.
          content:
            application/json:
              schema:
                type: object
                required: [ride]
                properties:
                  ride:
                    oneOf:
                      - $ref: '#/components/schemas/CurrentRide'
                      - type: 'null'
              examples:
                matched:
                  summary: Jashim has accepted and is on his way
                  value:
                    ride:
                      rideRequestId: 86274eb8-0f84-42b3-b2b8-3619d7c7f902
                      status: MATCHED
                      cancellable: false
                      pickup: { code: banani-road-11, name: Banani Road 11 }
                      destination: { code: mohakhali-bus-terminal, name: Mohakhali Bus Terminal }
                      requestedAt: '2026-09-25T12:17:06.592Z'
                      startedAt: null
                      completedAt: null
                      cancelledAt: null
                      route: { distanceMeters: 2214, durationSeconds: 569 }
                      soloEstimate:
                        fare: '130'
                        currency: BDT
                        pricingCode: dhaka-solo
                        pricingVersion: 1
                      sharedFare:
                        fare: '130'
                        currency: BDT
                        finalized: true
                        poolVersion: 1
                      driver: { displayName: Jashim }
                      vehicle: { name: Bullet, seatCapacity: 3 }
                      passengerCount: 1
                      stage: DRIVER_EN_ROUTE
                      nextAction: WATCH_DRIVER
                      searchExpiresAt: '2026-09-25T12:27:06.592Z'
                      memberStatus: ASSIGNED
                      pool:
                        poolId: f9247881-c272-4117-83ce-4f502f521b7b
                        status: DRIVER_EN_ROUTE
                        completedAt: null
                      timeline:
                        matchedAt: '2026-09-25T12:17:06.902Z'
                        departedAt: '2026-09-25T12:17:07.382Z'
                        driverArrivedAt: null
                        pickedUpAt: null
                        droppedOffAt: null
                      myStops:
                        - stopId: 8100d3eb-db04-4a6c-8329-04b9c85f397f
                          sequence: 1
                          stopType: PICKUP
                          status: PENDING
                          servicePoint: { code: banani-road-11, name: Banani Road 11 }
                          plannedArrivalAt: '2026-09-25T12:19:00.902Z'
                          actualArrivalAt: null
                          completedAt: null
                noRide:
                  summary: The passenger is not on a ride
                  value: { ride: null }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'

  /passengers/me/rides:
    get:
      tags: [Passenger reads]
      summary: The passenger's ride history
      description: |
        Every ride this passenger has requested, newest first, paged.

        The item is a **summary**: enough to render a list — where it was, when,
        what it cost, who drove — and deliberately not the full detail. Reading
        each ride's stops and event log to build a list would be a query per row,
        which is exactly the N+1 this projection exists to avoid. Use
        `GET /passengers/me/rides/{rideRequestId}` for one ride's detail.

        `from` and `to` are an inclusive range on `requested_at`. Both are optional
        and independent: `?from=` alone means "since", `?to=` alone means "up to".
      operationId: listMyRides
      parameters:
        - name: status
          in: query
          description: Only rides in this status. Unknown values are a 400, not an empty page.
          required: false
          schema:
            $ref: '#/components/schemas/RideRequestStatus'
        - name: from
          in: query
          description: Inclusive lower bound on `requestedAt`, as an ISO 8601 instant with an offset.
          required: false
          schema: { type: string, format: date-time }
          example: '2026-09-01T00:00:00+06:00'
        - name: to
          in: query
          description: Inclusive upper bound on `requestedAt`.
          required: false
          schema: { type: string, format: date-time }
          example: '2026-09-30T23:59:59+06:00'
        - name: limit
          in: query
          description: Page size. Defaults to 20; the maximum is 100.
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          description: Rows to skip. Combine with `hasMore` from the previous page.
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: One page of the passenger's own rides, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RideSummary' }
              examples:
                settled:
                  summary: A completed shared ride
                  value:
                    data:
                      - rideRequestId: 86274eb8-0f84-42b3-b2b8-3619d7c7f902
                        status: COMPLETED
                        cancellable: false
                        pickup: { code: banani-road-11, name: Banani Road 11 }
                        destination: { code: mohakhali-bus-terminal, name: Mohakhali Bus Terminal }
                        requestedAt: '2026-09-25T12:17:06.592Z'
                        startedAt: '2026-09-25T12:17:07.709Z'
                        completedAt: '2026-09-25T12:17:07.895Z'
                        cancelledAt: null
                        route: { distanceMeters: 2214, durationSeconds: 569 }
                        soloEstimate:
                          fare: '130'
                          currency: BDT
                          pricingCode: dhaka-solo
                          pricingVersion: 1
                        sharedFare: { fare: '130', currency: BDT, finalized: true, poolVersion: 1 }
                        driver: { displayName: Jashim }
                        vehicle: { name: Bullet, seatCapacity: 3 }
                        passengerCount: 1
                    pagination: { limit: 20, offset: 0, returned: 1, total: 1, hasMore: false }
                empty:
                  summary: A passenger who has never ridden
                  value:
                    data: []
                    pagination: { limit: 20, offset: 0, returned: 0, total: 0, hasMore: false }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'

  /passengers/me/rides/{rideRequestId}:
    get:
      tags: [Passenger reads]
      summary: One of the passenger's own rides, in detail
      description: |
        Adds three things a summary does not have: this passenger's own stops,
        their own lifecycle timeline, and the pool the journey was shared with.

        **Another passenger's ride is a 404**, not a 403 — a 403 would confirm the
        id is real, which tells one passenger that another passenger's ride exists.
        The ownership filter is part of the database query, so a ride that is not
        the caller's is simply not found.

        `timeline` is built by `src/services/timeline.rules.js`, which turns
        internal event types into sentences and **drops everything the passenger
        should not see**: the dispatch family (`DRIVER_OFFERED`, `DRIVER_REJECTED`,
        `DRIVER_OFFER_EXPIRED`, `POOL_CANDIDATE_EVALUATED`, `POOL_JOIN_OFFERED`,
        `POOL_JOIN_REJECTED`, `INITIAL_DISPATCH_FALLBACK`) is absent entirely, and
        no event's `metadata` — which names offers, candidate scores and member ids
        — is ever read. Entries are ordered by `sequence`, then timestamp, then id.
      operationId: getMyRide
      parameters:
        - name: rideRequestId
          in: path
          required: true
          description: The ride request to read. Must belong to the authenticated passenger.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The ride, with its own stops and timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideDetail' }
              example:
                rideRequestId: 86274eb8-0f84-42b3-b2b8-3619d7c7f902
                status: COMPLETED
                cancellable: false
                pickup: { code: banani-road-11, name: Banani Road 11 }
                destination: { code: mohakhali-bus-terminal, name: Mohakhali Bus Terminal }
                requestedAt: '2026-09-25T12:17:06.592Z'
                startedAt: '2026-09-25T12:17:07.709Z'
                completedAt: '2026-09-25T12:17:07.895Z'
                cancelledAt: null
                route: { distanceMeters: 2214, durationSeconds: 569 }
                soloEstimate: { fare: '130', currency: BDT, pricingCode: dhaka-solo, pricingVersion: 1 }
                sharedFare: { fare: '130', currency: BDT, finalized: true, poolVersion: 1 }
                driver: { displayName: Jashim }
                vehicle: { name: Bullet, seatCapacity: 3 }
                passengerCount: 1
                stage: RIDE_COMPLETED
                nextAction: RIDE_FINISHED
                searchExpiresAt: '2026-09-25T12:27:06.592Z'
                memberStatus: DROPPED_OFF
                myStops:
                  - stopId: 8100d3eb-db04-4a6c-8329-04b9c85f397f
                    sequence: 1
                    stopType: PICKUP
                    status: COMPLETED
                    servicePoint: { code: banani-road-11, name: Banani Road 11 }
                    plannedArrivalAt: '2026-09-25T12:19:00.902Z'
                    actualArrivalAt: '2026-09-25T12:17:07.486Z'
                    completedAt: '2026-09-25T12:17:07.607Z'
                  - stopId: d5c2eee2-c522-437a-a9c9-40d5f387e4d2
                    sequence: 2
                    stopType: DROPOFF
                    status: COMPLETED
                    servicePoint: { code: mohakhali-bus-terminal, name: Mohakhali Bus Terminal }
                    plannedArrivalAt: '2026-09-25T12:28:29.902Z'
                    actualArrivalAt: '2026-09-25T12:17:07.801Z'
                    completedAt: '2026-09-25T12:17:07.895Z'
                sharedRoute: { distanceMeters: 2214, durationSeconds: 569 }
                pool:
                  poolId: f9247881-c272-4117-83ce-4f502f521b7b
                  status: COMPLETED
                  passengerCount: 1
                  capacity: 3
                  completedAt: '2026-09-25T12:17:08.017Z'
                member:
                  memberStatus: DROPPED_OFF
                  matchedAt: '2026-09-25T12:17:06.902Z'
                  pickedUpAt: '2026-09-25T12:17:07.607Z'
                  droppedOffAt: '2026-09-25T12:17:07.895Z'
                timeline:
                  - sequence: 1
                    eventType: RIDE_REQUESTED
                    phase: REQUEST
                    label: Ride requested
                    actorType: PASSENGER
                    at: '2026-09-25T12:17:06.592Z'
                  - sequence: 3
                    eventType: PASSENGER_MATCHED
                    phase: MATCHING
                    label: You were matched with a driver
                    actorType: SYSTEM
                    at: '2026-09-25T12:17:06.902Z'
                  - sequence: 6
                    eventType: DRIVER_ARRIVED
                    phase: PICKUP
                    label: Your driver arrived at your pickup
                    actorType: SYSTEM
                    at: '2026-09-25T12:17:07.486Z'
                  - sequence: 7
                    eventType: PASSENGER_PICKED_UP
                    phase: PICKUP
                    label: You were picked up
                    actorType: DRIVER
                    at: '2026-09-25T12:17:07.607Z'
                  - sequence: 10
                    eventType: RIDE_COMPLETED
                    phase: END
                    label: Ride completed
                    actorType: SYSTEM
                    at: '2026-09-25T12:17:07.895Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------------------
  # Driver availability
  # -------------------------------------------------------------------------
  /drivers/me/availability:
    get:
      tags: [Driver availability]
      summary: The driver's own availability
      description: |
        Whether dispatch will consider this driver, and where they are.

        `operationalStatus` is the state machine's four values. A driver is
        dispatchable only while `AVAILABLE`; `OFFLINE` is excluded by the
        candidate query, `RESERVED` means an accepted pool whose trip has not
        departed, and `ON_RIDE` means a passenger is in the car.

        `online` is that same fact as the boolean a toggle binds to: `false`
        exactly when the status is `OFFLINE`. `canGoOnline`/`canGoOffline` are
        derived from the state, so a client shows the button the server would
        accept rather than reimplementing the rules.

        `servicePoint` and `currentServicePoint` are the same place; `servicePoint`
        also carries the id, which is what a client sends back when it goes
        online. Both are published so that a caller written against either shape
        works, and both come from one row so they cannot disagree.
      operationId: getAvailability
      parameters: []
      responses:
        '200':
          description: The driver's own availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverAvailability' }
              examples:
                available:
                  summary: Jashim is online at Banani Kakoli, waiting for work
                  value:
                    driverProfileId: 781bd925-1aa6-42ac-a03c-c2f49afa4a9e
                    status: AVAILABLE
                    online: true
                    operationalStatus: AVAILABLE
                    currentServicePoint: { code: banani-kakoli, name: Banani Kakoli }
                    servicePoint:
                      id: 00984d60-f962-4765-bbe3-ba40e7f61d98
                      code: banani-kakoli
                      name: Banani Kakoli
                    vehicle:
                      vehicleId: 136e7c11-0758-4887-b04b-41017bedf94e
                      name: Bullet
                      seatCapacity: 3
                    vehicles:
                      - vehicleId: 136e7c11-0758-4887-b04b-41017bedf94e
                        name: Bullet
                        seatCapacity: 3
                    availableSince: '2026-09-25T12:17:06.051Z'
                    lastSeenAt: '2026-09-25T12:17:06.051Z'
                    canGoOnline: true
                    canGoOffline: true
                    updatedAt: '2026-09-25T12:17:06.053Z'
                offline:
                  summary: A driver taking no work
                  value:
                    driverProfileId: 781bd925-1aa6-42ac-a03c-c2f49afa4a9e
                    status: OFFLINE
                    online: false
                    operationalStatus: OFFLINE
                    currentServicePoint: null
                    servicePoint: null
                    vehicle: null
                    vehicles: []
                    availableSince: null
                    lastSeenAt: '2026-09-25T12:15:00.000Z'
                    canGoOnline: true
                    canGoOffline: false
                    updatedAt: '2026-09-25T12:15:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
    patch:
      tags: [Driver availability]
      summary: Go online or offline
      description: |
        One write for the whole toggle, so a client sends what the driver wants
        rather than deciding which of two URLs to call and handling "already
        offline" itself.

        ```text
        { online: true,  servicePointCode | servicePointId, vehicleId? }  -> AVAILABLE
        { online: false }                                                 -> OFFLINE
        ```

        ## What this endpoint deliberately cannot do

        `operationalStatus` and `status` are **not accepted**: sending either is a
        400, not a silent no-op. A client may say "I am online" or "I am offline";
        it may never say "I am `ON_RIDE`". `RESERVED` and `ON_RIDE` are established
        by accepting an offer and departing for the first pickup, and a device that
        could set them could make itself dispatchable while carrying a passenger,
        or invisible while committed to one.

        ## Refusals

        | Situation | Status | Why |
        | --------- | ------ | --- |
        | `online: true` with no place | `400` | A driver who is online is somewhere; dispatch measures an approach from it |
        | Both `servicePointCode` and `servicePointId` | `400` | Two answers to one question; guessing which was meant puts the driver at the wrong corner |
        | `online` not a boolean | `400` | `"yes"` is not a state |
        | Unknown service point | `404` | A typo |
        | Inactive service point | `409` | A real place that is not accepting rides |
        | A `RESERVED` or `ON_RIDE` driver going offline | `409` | A passenger is waiting for this car; releasing that is an operator's decision, not a device's |
        | No active vehicle, or several and none chosen | `409` | Dispatch needs a vehicle with capacity |
        | Going offline while already offline | `200` | Idempotent: a retried toggle is not an error |

        Going online again while already `AVAILABLE` does not reset `availableSince`
        — a driver cannot gain idle credit by refreshing their position — but it
        does refresh `lastSeenAt`, which is what keeps them eligible for dispatch.
      operationId: setAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityRequest' }
            examples:
              onlineByCode:
                summary: Come online at a service point code
                value: { online: true, servicePointCode: banani-kakoli }
              onlineById:
                summary: Come online at a service point id, with a chosen vehicle
                value:
                  online: true
                  servicePointId: 00984d60-f962-4765-bbe3-ba40e7f61d98
                  vehicleId: 136e7c11-0758-4887-b04b-41017bedf94e
              offline:
                summary: Stop taking work
                value: { online: false }
      responses:
        '200':
          description: The availability after the change, in the same shape as the `GET`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverAvailability' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'
        '404':
          description: The service point in the body does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { message: 'Service point "nowhere-at-all" was not found' }
        '409':
          description: |
            The driver is `RESERVED` or `ON_RIDE`, the service point is inactive,
            or they have no usable vehicle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                reserved:
                  value:
                    error: { message: 'A driver who is RESERVED cannot go offline through this endpoint' }
                inactivePoint:
                  value:
                    error: { message: 'Service point "gulshan-2-circle" is not accepting rides right now' }

  # -------------------------------------------------------------------------
  # Driver reads
  # -------------------------------------------------------------------------
  /drivers/me/current-pool:
    get:
      tags: [Driver reads]
      summary: The pool the driver is committed to
      description: |
        The driver's active pool: the ordered plan, the next actionable stop, the
        passengers, the route, and — computed from the state on every read — the
        list of commands the driver may issue next.

        `allowedActions` is the point of the endpoint. It contains an action only
        when the corresponding command would succeed, so a client renders buttons
        rather than guessing, and it cannot drift from the rules because the same
        `trip.rules.js` answers both this and the command. On a finished pool it is
        empty.

        `pricing` reports **whether the fare is settled, never an amount**: a
        boolean and a version. Mid-trip, what a passenger is paying must not be part
        of a driver's decision about where to go next. A driver's *history* does
        report the pool's total — see `GET /drivers/me/rides/{poolId}`.

        `pool` is `null` for a driver with no active pool, which is the same answer
        a driver whose trip just finished gets. `/drivers/me/pool` is an alias of
        this path, kept so that a caller written before the trip milestone keeps
        working; both answer identically.
      operationId: getCurrentPool
      parameters: []
      responses:
        '200':
          description: The active pool, or `null`.
          content:
            application/json:
              schema:
                type: object
                required: [pool]
                properties:
                  pool:
                    oneOf:
                      - $ref: '#/components/schemas/Pool'
                      - type: 'null'
              examples:
                arrived:
                  summary: Jashim is at Nusrat's pickup and may collect her
                  value:
                    pool:
                      poolId: f9247881-c272-4117-83ce-4f502f521b7b
                      status: ARRIVED
                      version: 1
                      capacity: 3
                      vehicle: { name: Bullet, seatCapacity: 3 }
                      plan: { distanceMeters: 2214, durationSeconds: 569, stopCount: 2 }
                      stops:
