  /drivers/me/rides:
    get:
      tags: [Driver reads]
      summary: The pools the driver has driven
      description: |
        The driver's own history, newest first, paged.

        The unit is a **pool**, not a ride request. A pool is one car's journey: a
        driver who carried three passengers drove one trip, not three, and a
        history per ride request would show the same journey three times and make
        "how many trips did I drive" unanswerable.

        Each item is a summary: the vehicle, when it ran, where it started and
        ended, the route, and two counts. It deliberately does **not** include the
        passenger rows — a count is enough for a list, and reading every member of
        every pool on the page is the N+1 this projection avoids.

        `from` and `to` filter `createdAt`, not `completedAt`, because `createdAt`
        is never null: filtering by completion would hide the pools a driver cares
        most about, the ones still running. "Finished trips in a range" is
        `?status=COMPLETED&from=…&to=…`.
      operationId: listMyRides
      parameters:
        - name: status
          in: query
          description: Only pools in this status.
          required: false
          schema: { $ref: '#/components/schemas/RidePoolStatus' }
        - name: from
          in: query
          description: Inclusive lower bound on `createdAt`.
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Inclusive upper bound on `createdAt`.
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: Page size. Defaults to 20; the maximum is 100.
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          description: Rows to skip.
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: One page of the driver's own pools, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DriverRideSummary' }
              examples:
                completed:
                  summary: Jashim's finished Banani → Mohakhali trip
                  value:
                    data:
                      - poolId: f9247881-c272-4117-83ce-4f502f521b7b
                        status: COMPLETED
                        vehicle:
                          vehicleId: 136e7c11-0758-4887-b04b-41017bedf94e
                          name: Bullet
                          seatCapacity: 3
                        createdAt: '2026-09-25T12:17:06.902Z'
                        acceptedAt: '2026-09-25T12:17:06.902Z'
                        completedAt: '2026-09-25T12:17:08.017Z'
                        firstServicePoint: { code: banani-road-11, name: Banani Road 11 }
                        finalServicePoint: { code: mohakhali-bus-terminal, name: Mohakhali Bus Terminal }
                        route: { distanceMeters: 2214, durationSeconds: 569 }
                        passengerCount: 1
                        stopCount: 2
                        completedStopCount: 2
                        fare:
                          fareStatus: FINALIZED
                          finalized: true
                          finalizedAt: '2026-09-25T12:17:07.382Z'
                          currency: BDT
                          poolVersion: 1
                          totalPassengerFare: '130'
                    pagination: { limit: 20, offset: 0, returned: 1, total: 1, hasMore: false }
                empty:
                  summary: A driver who has not driven yet
                  value:
                    data: []
                    pagination: { limit: 20, offset: 0, returned: 0, total: 0, hasMore: false }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WrongRole'

  /drivers/me/rides/{poolId}:
    get:
      tags: [Driver reads]
      summary: One of the driver's own pools, in detail
      description: |
        The ordered plan, the passengers, the driver's own timestamps, the pool's
        lifecycle timeline, and the fare the pool came to.

        **Another driver's pool is a 404**, not a 403: a 403 would tell one driver
        that another driver's pool id is real.

        ## What a driver may see, and what they may not

        A driver has to operate the ride, so a passenger appears with a first name,
        their two service points and their own timestamps. Nothing else is read:

        * no passenger account field, user id, email or credential;
        * no *per-passenger* fare. `fare.totalPassengerFare` is the whole pool added
          up, with no key that could attribute an amount to a person;
        * no passenger event history — `ride_events` is that passenger's own record
          and is not queried here. The timeline is the **pool's**;
        * no other driver's data.

        `allowedActions` is included and is empty for a finished pool, so a
        history detail and a live pool answer in one shape.
      operationId: getMyRide
      parameters:
        - name: poolId
          in: path
          required: true
          description: The pool to read. Must have been driven by the authenticated driver.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The pool, with its plan, passengers, fare and timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverRideDetail' }
              example:
                poolId: f9247881-c272-4117-83ce-4f502f521b7b
                status: COMPLETED
                version: 1
                capacity: 3
                vehicle:
                  vehicleId: 136e7c11-0758-4887-b04b-41017bedf94e
                  name: Bullet
                  seatCapacity: 3
                createdAt: '2026-09-25T12:17:06.902Z'
                acceptedAt: '2026-09-25T12:17:06.902Z'
                departedAt: '2026-09-25T12:17:07.382Z'
                driverArrivedAt: '2026-09-25T12:17:07.486Z'
                startedAt: '2026-09-25T12:17:07.709Z'
                completedAt: '2026-09-25T12:17:08.017Z'
                cancelledAt: null
                route: { distanceMeters: 2214, durationSeconds: 569 }
                stops:
                  - stopId: 8100d3eb-db04-4a6c-8329-04b9c85f397f
                    sequence: 1
                    stopType: PICKUP
                    status: COMPLETED
                    servicePoint: { code: banani-road-11, name: Banani Road 11 }
                    poolMemberId: 2378fa0d-54f7-48c8-b588-e1ef23bbd66d
                    plannedArrivalAt: '2026-09-25T12:19:00.902Z'
                    actualArrivalAt: '2026-09-25T12:17:07.486Z'
                    completedAt: '2026-09-25T12:17:07.607Z'
                  - stopId: d5c2eee2-c522-437a-a9c9-40d5f387e4d2
                    sequence: 2
                    stopType: DROPOFF
                    status: COMPLETED
                    servicePoint: { code: mohakhali-bus-terminal, name: Mohakhali Bus Terminal }
                    poolMemberId: 2378fa0d-54f7-48c8-b588-e1ef23bbd66d
                    plannedArrivalAt: '2026-09-25T12:28:29.902Z'
                    actualArrivalAt: '2026-09-25T12:17:07.801Z'
                    completedAt: '2026-09-25T12:17:07.895Z'
                nextStop: null
                passengers:
                  - memberId: 2378fa0d-54f7-48c8-b588-e1ef23bbd66d
                    memberStatus: DROPPED_OFF
                    displayName: Nusrat
                    pickup: { code: banani-road-11, name: Banani Road 11 }
                    dropoff: { code: mohakhali-bus-terminal, name: Mohakhali Bus Terminal }
                    matchedAt: '2026-09-25T12:17:06.902Z'
